name: fleetpulse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------
  # profile: core — MQTT, Kafka, Flink runtime, the polyglot data stores.
  # web joins this profile once its code exists (session 7) — no point
  # defining a build context with no Dockerfile.
  # ---------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    profiles: ["core"]
    ports:
      - "8883:8883"
    volumes:
      - ./infra/compose/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/compose/mosquitto.acl:/mosquitto/config/mosquitto.acl:ro
      - ./infra/certs/issued:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8883"]
      interval: 15s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    profiles: ["core"]
    ports:
      - "9092:9092"
      - "29092:29092"  # EXTERNAL listener for host tools (bench-ingest, etc.) — see below
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Two listeners on purpose: in-network services (ingest-gateway, Flink)
      # use PLAINTEXT (advertised as kafka:9092, resolvable inside compose's
      # network); host-run tools like services/simulator/bench_ingest.py use
      # EXTERNAL (advertised as localhost:29092) — without this split,
      # host clients get redirected to the unresolvable "kafka" hostname
      # after their initial connect, once they fetch broker metadata.
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      # Must match the kafka-data mount below: without it the env-generated
      # server.properties has no log.dirs, the broker falls back to
      # /tmp/kafka-logs inside the container, and every recreate silently
      # wipes all topics and consumer-group offsets.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      # 1g, not PLAN §3's original 512m: at 512m the live set (~410 MB after
      # GC) left G1 no headroom — evacuation failures and stop-the-world
      # pauses up to 14s, longer than KRaft's 9s broker session timeout, so
      # the broker fenced itself, dropped the group coordinator, and every
      # consumer (state-writer, visibly) lost its session for minutes.
      KAFKA_HEAP_OPTS: "-Xmx1g -Xms1g"
    volumes:
      - kafka-data:/var/lib/kafka/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  schema-registry:
    image: apicurio/apicurio-registry-mem:2.6.5.Final
    profiles: ["core"]
    ports:
      - "8080:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  ingest-gateway:
    build:
      context: .
      dockerfile: services/ingest-gateway/Dockerfile
    profiles: ["core"]
    depends_on:
      - mosquitto
      - kafka
    environment:
      MQTT_HOST: mosquitto
      MQTT_PORT: 8883
      MQTT_CA_CERT: infra/certs/ca/ca.crt
      MQTT_SHARD_COUNT: ${MQTT_SHARD_COUNT:-32}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
    volumes:
      - ./infra/certs/ca:/app/infra/certs/ca:ro
      - ./infra/certs/issued:/app/infra/certs/issued:ro
    logging: *default-logging
    restart: unless-stopped

  flink-jobmanager:
    build:
      context: ./infra/compose/flink
    profiles: ["core"]
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        s3.endpoint: http://minio:3900
        s3.path.style.access: true
        s3.access-key: ${GARAGE_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
        s3.secret-key: ${GARAGE_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
        # Garage (unlike AWS) reports NoSuchKey on bulk-deleting S3A's fake
        # directory markers, which S3A retries forever — a checkpointing job
        # hangs in INITIALIZING. "keep" makes S3A never delete them.
        fs.s3a.directory.marker.retention: keep
    volumes:
      - ./stream/flink/sql:/opt/flink/sql:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/config || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  flink-taskmanager:
    build:
      context: ./infra/compose/flink
    profiles: ["core"]
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        # 1024m (PLAN §3's original budget) OOM'd the TaskManager under
        # sustained make simulate traffic — the cooling rule's HOP window
        # (30 s size / 5 s slide, so 6 overlapping windows per key) plus the
        # dedup operator's keyed state outgrew the ~400 MB of task heap that
        # leaves after JVM/network/managed-memory overhead. 2048m is Flink's
        # own documented floor for anything beyond a toy job; still small
        # next to the laptop's ~13 GB Docker budget.
        taskmanager.memory.process.size: 2048m
        taskmanager.numberOfTaskSlots: 2
        s3.endpoint: http://minio:3900
        s3.path.style.access: true
        s3.access-key: ${GARAGE_ACCESS_KEY:-GKdeadbeefdeadbeefdeadbeef}
        s3.secret-key: ${GARAGE_SECRET_KEY:-deadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeefdeadbeef}
        fs.s3a.directory.marker.retention: keep
    logging: *default-logging

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["core"]
    ports:
      # Host port 5434, not 5432: a native Windows PostgreSQL service already
      # holds 5432 on this machine, shadowing Docker's forward (session 3).
      - "5434:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetpulse}
      POSTGRES_USER: ${POSTGRES_USER:-fleetpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres/migrations:/docker-entrypoint-initdb.d:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetpulse} -d ${POSTGRES_DB:-fleetpulse}"]
      interval: 10s
      timeout: 5s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:2.15.3-pg16
    profiles: ["core"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-telemetry}
      POSTGRES_USER: ${TIMESCALE_USER:-fleetpulse}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-changeme}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/timescale/migrations:/docker-entrypoint-initdb.d:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-fleetpulse} -d ${TIMESCALE_DB:-telemetry}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    profiles: ["core"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    profiles: ["core"]
    ports:
      # Host port 27018, not 27017: a native Windows MongoDB service already
      # holds 27017 on this dev machine, shadowing Docker's forward (same
      # class of conflict session 3 hit with Postgres/5432). The in-network
      # hostname/port (mongodb:27017) other containers use is unaffected.
      - "${MONGO_PORT_EXTERNAL:-27018}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-fleetpulse}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-fleetpulse}
    volumes:
      - mongo-data:/data/db
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO went proprietary/archived 2025-2026; Garage is the maintained
  # S3-compatible drop-in for single-node POC use.
  # S3 API on :9000, admin API on :3900, health on :3902.
  # boto3 / Flink S3 connectors work unchanged against :9000.
  minio:
    image: dxflrs/garage:v1.0.1
    profiles: ["core"]
    ports:
      - "9000:3900"   # S3 API
      - "3902:3902"   # health / metrics
    environment:
      GARAGE_ALLOW_WORLD_READABLE_CONFIG: "true"
    volumes:
      - minio-data:/var/lib/garage/data
      - ./infra/compose/garage.toml:/etc/garage.toml:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    profiles: ["core"]
    command: start-dev --import-realm
    ports:
      - "8082:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  state-writer:
    build:
      context: .
      dockerfile: services/state-writer/Dockerfile
    profiles: ["core"]
    depends_on:
      - kafka
      - redis
      - mongodb
      - postgres
    environment:
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      TELEMETRY_TOPIC: telemetry
      ALERTS_TOPIC: alerts
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-fleetpulse}:${MONGO_ROOT_PASSWORD:-changeme}@mongodb:27017
      MONGO_DB: ${MONGO_DB:-fleetpulse}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fleetpulse}
      POSTGRES_USER: ${POSTGRES_USER:-fleetpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    logging: *default-logging
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    profiles: ["core"]
    depends_on:
      - postgres
      - redis
      - mongodb
      - kafka
      - keycloak
    ports:
      - "8000:8000"
    environment:
      API_PORT: 8000
      API_DB_USER: fleetpulse_api
      API_DB_PASSWORD: changeme
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fleetpulse}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:-fleetpulse}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_DB: ${MONGO_DB:-fleetpulse}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:9092}
      # 8080, not the .env KEYCLOAK_PORT=8081 default (stale — Keycloak's
      # container listens on its image default 8080; the host-published
      # port 8082 is what a browser/API-client uses instead, see
      # infra/keycloak/fleetpulse-realm.json's comment on issuer validation).
      KEYCLOAK_HOST: keycloak
      KEYCLOAK_INTERNAL_PORT: 8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-fleetpulse}
      RATE_LIMIT_CAPACITY: 60
      RATE_LIMIT_PER_MINUTE: 60
      # ai profile: only reachable if `copilot` is actually running; the
      # router maps a connection failure to a 404 the web UI already
      # understands as "not deployed yet" (session 7's CopilotPage.tsx).
      COPILOT_URL: ${COPILOT_URL:-http://copilot:9100}
      # obs profile only; a no-op (api/infra/otel.py) if unset or if
      # otel-collector isn't actually running (exports retry in the
      # background, never block a request).
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      # obs profile only (metabase service); routers/analytics.py maps a
      # connection failure to 404, same "not deployed yet" contract as
      # COPILOT_URL above.
      METABASE_INTERNAL_URL: ${METABASE_INTERNAL_URL:-http://metabase:3000}
      METABASE_SITE_URL: ${METABASE_SITE_URL:-http://localhost:3002}
      METABASE_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@demo.fleetpulse}
      METABASE_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-changeme123}
      MB_EMBEDDING_SECRET_KEY: ${MB_EMBEDDING_SECRET_KEY:-}
    logging: *default-logging
    restart: unless-stopped

  web:
    build:
      context: ./web
      args:
        VITE_API_URL: http://localhost:8000
        VITE_KEYCLOAK_URL: http://localhost:8082
        VITE_KEYCLOAK_REALM: fleetpulse
        VITE_KEYCLOAK_CLIENT_ID: fleetpulse-web
    profiles: ["core"]
    depends_on:
      - api
      - keycloak
    ports:
      - "5173:5173"
    logging: *default-logging
    restart: unless-stopped

  # ---------------------------------------------------------------------
  # profile: ai — copilot + MCP server (session 8). Claude swapped for
  # Gemini's free tier (GOOGLE_API_KEY) to avoid a paid ANTHROPIC_API_KEY for
  # this hackathon — see docs/PROGRESS.md session 8 for the reasoning; the
  # LangGraph/MCP architecture is unchanged, only the model client.
  # ---------------------------------------------------------------------
  copilot:
    build:
      context: .
      dockerfile: services/copilot/Dockerfile
    profiles: ["ai"]
    depends_on:
      - mcp-server
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-flash-lite-latest}
      MCP_SERVER_URL: http://mcp-server:9001/sse
      COPILOT_PORT: 9100
    logging: *default-logging

  mcp-server:
    build:
      context: .
      dockerfile: services/mcp-server/Dockerfile
    profiles: ["ai"]
    environment:
      MCP_SERVER_PORT: 9001
      API_DB_USER: fleetpulse_api
      API_DB_PASSWORD: changeme
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-fleetpulse}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
    logging: *default-logging

  # ---------------------------------------------------------------------
  # profile: batch — Spark (run on demand, session 5)
  # ---------------------------------------------------------------------
  spark:
    image: apache/spark:3.5.1-python3
    profiles: ["batch"]
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./batch/spark:/opt/spark-jobs
    environment:
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: 5432
      TIMESCALE_DB: ${TIMESCALE_DB:-telemetry}
      TIMESCALE_USER: ${TIMESCALE_USER:-fleetpulse}
      TIMESCALE_PASSWORD: ${TIMESCALE_PASSWORD:-changeme}
    logging: *default-logging

  # ---------------------------------------------------------------------
  # profile: obs — OTel Collector, Prometheus, Grafana (session 8)
  # ---------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    profiles: ["obs"]
    volumes:
      - ./infra/compose/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    volumes:
      - ./infra/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.4
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./infra/compose/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      # Mounted as a single file, not the parent dir: bind-mounting the
      # dashboards/json subdirectory below would otherwise need to create a
      # mountpoint inside an already-mounted (read-only) parent, which fails.
      - ./infra/compose/grafana/provisioning/dashboards/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/compose/grafana/dashboards:/etc/grafana/provisioning/dashboards/json:ro
    ports:
      - "3001:3000"
    logging: *default-logging

  # Analytics refinement (before session 10): Metabase reads the fleet's raw
  # data (Postgres core + TimescaleDB telemetry) via the metabase_reporting
  # BYPASSRLS role (db/postgres/migrations/008_metabase_role.sql) — a
  # documented trade-off, see that migration's comment. Lives in `obs`
  # alongside grafana/prometheus since it's an optional, heavier container
  # (PLAN §3: the laptop can't run every profile at full scale at once).
  metabase:
    image: metabase/metabase:v0.50.31
    profiles: ["obs"]
    environment:
      MB_ADMIN_EMAIL: ${METABASE_ADMIN_EMAIL:-admin@demo.fleetpulse}
      MB_ADMIN_PASSWORD: ${METABASE_ADMIN_PASSWORD:-changeme123}
      MB_EMBEDDING_SECRET_KEY: ${MB_EMBEDDING_SECRET_KEY:-}
    volumes:
      - metabase-data:/metabase-data
    ports:
      - "3002:3000"
    logging: *default-logging

  # ---------------------------------------------------------------------
  # profile: chaos — 3-broker Kafka for chaos/failover testing (session 9)
  # ---------------------------------------------------------------------
  kafka-chaos-1:
    image: apache/kafka:3.8.0
    profiles: ["chaos"]
    ports:
      - "29093:29093"  # EXTERNAL listener for the host-run broker-kill chaos test (session 10 gap-fill)
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-chaos-1:9092,EXTERNAL://localhost:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-chaos-1:9093,2@kafka-chaos-2:9093,3@kafka-chaos-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    logging: *default-logging

  kafka-chaos-2:
    image: apache/kafka:3.8.0
    profiles: ["chaos"]
    ports:
      - "29094:29094"
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-chaos-2:9092,EXTERNAL://localhost:29094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-chaos-1:9093,2@kafka-chaos-2:9093,3@kafka-chaos-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    logging: *default-logging

  kafka-chaos-3:
    image: apache/kafka:3.8.0
    profiles: ["chaos"]
    ports:
      - "29095:29095"
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,EXTERNAL://0.0.0.0:29095
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-chaos-3:9092,EXTERNAL://localhost:29095
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-chaos-1:9093,2@kafka-chaos-2:9093,3@kafka-chaos-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    logging: *default-logging

volumes:
  mosquitto-data:
  kafka-data:
  postgres-data:
  timescale-data:
  redis-data:
  mongo-data:
  minio-data:
  prometheus-data:
  grafana-data:
  metabase-data:
