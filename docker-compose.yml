name: fleetpulse

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ---------------------------------------------------------------------
  # profile: core — MQTT, Kafka, Flink runtime, the polyglot data stores.
  # ingest-gateway, api and web join this profile once their code exists
  # (sessions 2, 6, 7) — no point defining a build context with no Dockerfile.
  # ---------------------------------------------------------------------
  mosquitto:
    image: eclipse-mosquitto:2.0
    profiles: ["core"]
    ports:
      - "8883:8883"
    volumes:
      - ./infra/compose/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./infra/certs/issued:/mosquitto/certs:ro
      - mosquitto-data:/mosquitto/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "8883"]
      interval: 15s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.8.0
    profiles: ["core"]
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_NUM_PARTITIONS: 6
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10

  schema-registry:
    image: apicurio/apicurio-registry-mem:2.6.5.Final
    profiles: ["core"]
    ports:
      - "8080:8080"
    environment:
      QUARKUS_HTTP_PORT: 8080
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  flink-jobmanager:
    image: flink:1.19-scala_2.12-java11
    profiles: ["core"]
    command: jobmanager
    ports:
      - "8081:8081"
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
    volumes:
      - ./stream/flink/sql:/opt/flink/sql:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/config || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  flink-taskmanager:
    image: flink:1.19-scala_2.12-java11
    profiles: ["core"]
    command: taskmanager
    depends_on:
      - flink-jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.memory.process.size: 1024m
        taskmanager.numberOfTaskSlots: 2
    logging: *default-logging

  postgres:
    image: pgvector/pgvector:pg16
    profiles: ["core"]
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fleetpulse}
      POSTGRES_USER: ${POSTGRES_USER:-fleetpulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./db/postgres/migrations:/docker-entrypoint-initdb.d:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fleetpulse} -d ${POSTGRES_DB:-fleetpulse}"]
      interval: 10s
      timeout: 5s
      retries: 10

  timescaledb:
    image: timescale/timescaledb:2.15.3-pg16
    profiles: ["core"]
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: ${TIMESCALE_DB:-telemetry}
      POSTGRES_USER: ${TIMESCALE_USER:-fleetpulse}
      POSTGRES_PASSWORD: ${TIMESCALE_PASSWORD:-changeme}
    volumes:
      - timescale-data:/var/lib/postgresql/data
      - ./db/timescale/migrations:/docker-entrypoint-initdb.d:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TIMESCALE_USER:-fleetpulse} -d ${TIMESCALE_DB:-telemetry}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    profiles: ["core"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    logging: *default-logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mongodb:
    image: mongo:7.0
    profiles: ["core"]
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-fleetpulse}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-fleetpulse}
    volumes:
      - mongo-data:/data/db
    logging: *default-logging
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10

  # MinIO went proprietary/archived 2025-2026; Garage is the maintained
  # S3-compatible drop-in for single-node POC use.
  # S3 API on :9000, admin API on :3900, health on :3902.
  # boto3 / Flink S3 connectors work unchanged against :9000.
  minio:
    image: dxflrs/garage:v1.0.1
    profiles: ["core"]
    ports:
      - "9000:3900"   # S3 API
      - "3902:3902"   # health / metrics
    environment:
      GARAGE_ALLOW_WORLD_READABLE_CONFIG: "true"
    volumes:
      - minio-data:/var/lib/garage/data
      - ./infra/compose/garage.toml:/etc/garage.toml:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    profiles: ["core"]
    command: start-dev --import-realm
    ports:
      - "8082:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-changeme}
      JAVA_OPTS_APPEND: "-Xms256m -Xmx512m"
    volumes:
      - ./infra/keycloak:/opt/keycloak/data/import:ro
    logging: *default-logging
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/localhost/8080 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # profile: ai — copilot + MCP server (built in session 8)
  # ---------------------------------------------------------------------
  copilot:
    build: ./services/copilot
    profiles: ["ai"]
    depends_on:
      - mcp-server
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    logging: *default-logging

  mcp-server:
    build: ./services/mcp-server
    profiles: ["ai"]
    logging: *default-logging

  # ---------------------------------------------------------------------
  # profile: batch — Spark (run on demand, session 5)
  # ---------------------------------------------------------------------
  spark:
    image: apache/spark:3.5.1-python3
    profiles: ["batch"]
    command: ["tail", "-f", "/dev/null"]
    volumes:
      - ./batch/spark:/opt/spark-jobs:ro
    logging: *default-logging

  # ---------------------------------------------------------------------
  # profile: obs — OTel Collector, Prometheus, Grafana (session 8)
  # ---------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    profiles: ["obs"]
    volumes:
      - ./infra/compose/otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
    logging: *default-logging

  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: ["obs"]
    volumes:
      - ./infra/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    logging: *default-logging

  grafana:
    image: grafana/grafana:11.1.4
    profiles: ["obs"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-changeme}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    logging: *default-logging

  # ---------------------------------------------------------------------
  # profile: chaos — 3-broker Kafka for chaos/failover testing (session 9)
  # ---------------------------------------------------------------------
  kafka-chaos-1:
    image: apache/kafka:3.8.0
    profiles: ["chaos"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-chaos-1:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-chaos-1:9093,2@kafka-chaos-2:9093,3@kafka-chaos-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    logging: *default-logging

  kafka-chaos-2:
    image: apache/kafka:3.8.0
    profiles: ["chaos"]
    environment:
      KAFKA_NODE_ID: 2
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-chaos-2:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-chaos-1:9093,2@kafka-chaos-2:9093,3@kafka-chaos-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    logging: *default-logging

  kafka-chaos-3:
    image: apache/kafka:3.8.0
    profiles: ["chaos"]
    environment:
      KAFKA_NODE_ID: 3
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-chaos-3:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka-chaos-1:9093,2@kafka-chaos-2:9093,3@kafka-chaos-3:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
    logging: *default-logging

volumes:
  mosquitto-data:
  kafka-data:
  postgres-data:
  timescale-data:
  redis-data:
  mongo-data:
  minio-data:
  prometheus-data:
  grafana-data:
