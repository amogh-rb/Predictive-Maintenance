  name: fleetpulse-api
  labels:
    app.kubernetes.io/part-of: fleetpulse
    app.kubernetes.io/name: api
    app.kubernetes.io/instance: fleetpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
      app.kubernetes.io/instance: fleetpulse
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: fleetpulse
        app.kubernetes.io/name: api
        app.kubernetes.io/instance: fleetpulse
    spec:
      containers:
        - name: api
          image: fleetpulse-api:latest
          ports:
            - containerPort: 8000
          env:
            - name: TENANT_DEFAULT
              value: "demo"
            - name: KAFKA_BROKERS
              value: "fleetpulse-kafka-bootstrap:9092"
            - name: MONGO_HOST
              value: "fleetpulse-mongodb"
            - name: POSTGRES_HOST
