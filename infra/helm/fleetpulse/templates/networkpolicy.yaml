{{/* Default-deny ingress per service, opened only to same-namespace pods and
the ingress controller — PLAN §4 "NetworkPolicy". Egress is left open (DNS +
the bitnami stores + Strimzi Kafka + external Gemini/Keycloak calls span too
many destinations to enumerate for a POC); a production rollout would lock
that down too. */}}
{{- if .Values.networkPolicy.enabled }}
{{- range $name, $svc := .Values.services }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "fleetpulse.serviceName" (dict "root" $ "name" $name) }}
  labels:
    {{- include "fleetpulse.labels" (dict "root" $ "name" $name) | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
      app.kubernetes.io/instance: {{ $.Release.Name }}
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector: {}
      {{- if $svc.port }}
      ports:
        - port: {{ $svc.port }}
      {{- end }}
---
{{- end }}
{{- end }}
