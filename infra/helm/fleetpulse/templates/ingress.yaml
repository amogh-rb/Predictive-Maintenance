{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-web
  annotations:
    kubernetes.io/ingress.class: {{ .Values.ingress.className }}
spec:
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "fleetpulse.serviceName" (dict "root" $ "name" "api") }}
                port: { number: {{ (index .Values.services "api").port }} }
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "fleetpulse.serviceName" (dict "root" $ "name" "web") }}
                port: { number: {{ (index .Values.services "web").port }} }
{{- end }}
